name: Hotel C - Backend CI

# Workflow uruchamia się tylko dla zmian w backendzie, aby nie obciążać CI zmianami we frontendzie. (DamianTchorzewski_72206)
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  backend-checks:
    name: Lint, Tests and Build
    runs-on: ubuntu-latest

    # Baza dla testów integracyjnych. Dane logowania są takie same jak w docker-compose.yml. (DamianTchorzewski_72206)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hotel_user
          POSTGRES_PASSWORD: hotel_password
          POSTGRES_DB: hotel_c_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotel_user -d hotel_c_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Klient Prisma nie jest w repozytorium, a lint i testy wymagają jego typów. (DamianTchorzewski_72206)
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check code with oxlint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      # Testy e2e używają atrapy bazy, więc nie potrzebują serwisu PostgreSQL. (DamianTchorzewski_72206)
      - name: Run e2e tests
        run: npm run test:e2e

      # Test sam tworzy bazę hotel_c_test i stosuje migracje, więc sprawdza także constraint blokujący podwójne rezerwacje. (DamianTchorzewski_72206)
      - name: Run integration tests (PostgreSQL)
        run: npm run test:integration

      - name: Build backend
        run: npm run build
